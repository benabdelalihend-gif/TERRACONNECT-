<!DOCTYPE html>
<!-- Page du module Stocks - TerraConnect. lang="fr" = la page est en français -->
<html lang="fr">
<head>
  <!-- Encodage UTF-8 : permet d'afficher les accents (é, è, à...) correctement -->
  <meta charset="UTF-8">
  <!-- Viewport : adapte la page à la taille de l'écran (téléphone, tablette, PC) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifier un stock - TerraConnect</title>
  <!-- Font Awesome : bibliothèque d'icônes (balises <i class="fa-solid ...">). Nécessite internet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Notre feuille de style commune (couleurs, mise en page de la charte TerraConnect) -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- ========== MENU LATÉRAL (identique sur toutes les pages) ========== -->
  <aside class="sidebar">
    <!-- Logo + nom : un clic ramène au tableau de bord -->
    <a class="logo" href="dashboard-stocks.html"><img src="assets/img/logo-terraconnect.png" alt="Logo TerraConnect"><span>TerraConnect</span></a>
    <nav>
      <!-- Liens de MON module. La classe "actif" met en vert clair la page en cours -->
      <div class="menu-titre">Module Stocks</div>
      <a class="lien" href="dashboard-stocks.html"><i class="fa-solid fa-chart-line"></i> Tableau de bord</a>
      <a class="lien actif" href="liste-stocks.html"><i class="fa-solid fa-warehouse"></i> Stocks</a>
      <a class="lien" href="liste-produits-stock.html"><i class="fa-solid fa-boxes-stacked"></i> Produits stockés</a>
      <a class="lien" href="alertes-stock.html"><i class="fa-solid fa-triangle-exclamation"></i> Alertes</a>
      <!-- Modules des autres membres : grisés et non cliquables (classe "desactive") pour l'instant -->
      <div class="menu-titre">Autres modules</div>
      <a class="lien desactive" href="#"><i class="fa-solid fa-users"></i> Utilisateurs</a>
      <a class="lien desactive" href="#"><i class="fa-solid fa-truck"></i> Livraisons</a>
      <a class="lien desactive" href="#"><i class="fa-solid fa-tractor"></i> Matériel agricole</a>
      <a class="lien desactive" href="#"><i class="fa-solid fa-recycle"></i> Déchets &amp; Recyclage</a>
      <a class="lien desactive" href="#"><i class="fa-solid fa-cart-shopping"></i> Marketplace</a>
    </nav>
    <!-- Lien de déconnexion en bas du menu -->
    <div class="deconnexion"><a class="lien" href="#"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a></div>
  </aside>

  <!-- ========== ZONE DE DROITE : barre du haut + contenu de la page ========== -->
  <div class="contenu">
    <!-- Barre du haut : champ de recherche et utilisateur connecté -->
    <header class="topbar">
      <div class="recherche"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Rechercher..."></div>
      <div class="admin"><div class="avatar">H</div> Hend Ben Abdeli</div>
    </header>

    <!-- ========== CONTENU PROPRE À CETTE PAGE ========== -->
    <main>
      <!-- En-tête : fil d'Ariane, titre, description et bouton d'action -->
      <div class="entete">
        <div>
          <div class="fil"><a href="liste-stocks.html">Stocks</a> / Modifier</div>
          <h1>Modifier le stock</h1>
          <p>Mettez à jour les informations du stock sélectionné.</p>
        </div>
      </div>

      <div class="carte carte-form">
        <!-- Formulaire de MODIFICATION (Update) : même structure que l'ajout, mais les champs sont déjà remplis avec value="..." -->
        <form action="#" method="post">
          <!-- Champ caché : envoie l'identifiant du stock à modifier sans l'afficher -->
          <input type="hidden" name="id" value="1">
          <div class="champ">
            <label for="nom">Nom du stock *</label>
            <input type="text" id="nom" name="nom" value="Stock Principal" required>
          </div>
          <div class="ligne">
            <div class="champ">
              <label for="emplacement">Emplacement *</label>
              <input type="text" id="emplacement" name="emplacement" value="Ferme Nord" required>
            </div>
            <div class="champ">
              <label for="date">Date de création *</label>
              <input type="date" id="date" name="date_creation" value="2026-10-12" required>
            </div>
          </div>
          <div class="champ">
            <label for="capacite">Capacité maximale (kg)</label>
            <input type="number" id="capacite" name="capacite" min="0" value="5000">
          </div>
          <div class="champ">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4">Stock principal de la ferme nord : légumes de saison.</textarea>
          </div>
          <!-- Annuler = retour sans rien changer, Enregistrer = envoie les modifications -->
          <div class="form-actions">
            <a href="liste-stocks.html" class="btn btn-clair">Annuler</a>
            <button type="submit" class="btn btn-primaire"><i class="fa-solid fa-floppy-disk"></i> Enregistrer</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
